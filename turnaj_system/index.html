<!DOCTYPE html>
<html lang="cs">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Turnaj PRO</title>

<link rel="stylesheet" href="projekt.css">

</head>
<body>

<div class="sidebar">

    <div class="logo">
         Turnaj
    </div>

    <ul>

        <li class="active"> Dashboard</li>
        <li> Týmy</li>
        <li> Rozpis</li>
        <li> Playoff</li>

    </ul>

</div>

<div class="main">

    <div class="topbar">

        <button onclick="toggleTheme()">
             Dark mode
        </button>

        <button class="danger" onclick="location.reload()">
            Reset
        </button>

    </div>

    <div class="card hero">

        <div>

            <h1> Turnajový systém</h1>

            <p>
                Organizace turnajů, zápasů a playoff
            </p>

        </div>

    </div>

    <div class="grid">

        <div class="card">

            <h2>👥 Týmy</h2>

            <div class="row">

                <input
                    type="text"
                    id="teamInput"
                    placeholder="Název týmu"
                >

                <button onclick="addTeam()">
                    Přidat
                </button>

            </div>

            <div id="teams"></div>

        </div>

        <div class="card">

            <h2> Rozpis zápasů</h2>

            <button onclick="generateMatches()">
                Vygenerovat zápasy
            </button>

            <div id="matches"></div>

        </div>

    </div>

    <div class="card">

        <h2> Playoff pavouk</h2>

        <div id="bracket" class="bracket"></div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
